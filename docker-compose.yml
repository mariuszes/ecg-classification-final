services:
  mlflow:
    image: ecg-ml
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts localhost:*,mlflow,mlflow:5000,127.0.0.1:*
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow

  api:
    image: ecg-ml
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_URI=models:/ecg_classifier@champion
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./data/processed:/app/data/processed
      - ./data/ptb-xl-plus:/app/data/ptb-xl-plus:ro
      - ./models:/app/models
      - ./mlflow:/mlflow
    depends_on:
      - mlflow

  frontend:
    image: ecg-ml
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/frontend.py --server.address 0.0.0.0 --server.port 8501
    environment:
      - FRONTEND_API_URL=http://api:8000
      - FRONTEND_MLFLOW_URL=http://localhost:5000
      - FRONTEND_PROMETHEUS_URL=http://localhost:9090
      - FRONTEND_GRAFANA_URL=http://localhost:3000
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./data/processed:/app/data/processed
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus

    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-storage: 
  prometheus-storage:
